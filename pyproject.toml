[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvdinner"
version = "1.9.2"
description = "IPTV player with M3U/XMLTV EPG integration"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "python-mpv>=1.0.7",
    "requests>=2.31",
    "Pillow>=10.0",
    "windows-curses>=2.3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional, not a core dependency, so Python 3.10 users (below
# pychromecast's own floor) and distros without a pychromecast package
# aren't affected -- see the "Casting" section in README.md.
chromecast = [
    "pychromecast>=14; python_version >= '3.11'",
]

[project.scripts]
tvdinner = "tvdinner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvdinner = ["fonts/*.ttf", "fonts/LICENSE", "images/*.png"]
