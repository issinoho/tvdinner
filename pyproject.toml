[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvdinner"
version = "0.1.0"
description = "IPTV player with M3U/XMLTV EPG integration"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "python-mpv>=1.0.7",
    "requests>=2.31",
    "Pillow>=10.0",
    "windows-curses>=2.3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tvdinner = "tvdinner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvdinner = ["fonts/*.ttf", "fonts/LICENSE", "images/*.png"]
