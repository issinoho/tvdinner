name: Tests

# Runs the test suite on every push to master and every pull request
# (including Dependabot's) -- unlike release.yml, this isn't gated on a
# version tag, so it's the only CI signal a PR actually gets before merge.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml's own floor, plus a current release -- catches a
        # 3.10-only regression without paying for every version between.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libmpv
        # tvdinner.player imports the `mpv` package at module level, which
        # loads libmpv via ctypes as soon as it's imported -- needed just to
        # collect tests/test_player.py, not to actually drive playback.
        run: sudo apt-get update && sudo apt-get install -y libmpv2

      - name: Install tvdinner with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
