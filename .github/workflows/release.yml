name: Build and publish release packages

# Fires on every version tag push (e.g. v0.1.0-19) -- matches the
# manual workflow used up through v0.1.0-18: tag, build .deb, .rpm, a
# Windows installer, and a macOS .dmg, attach all four to the GitHub
# Release for that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian packaging build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools pybuild-plugin-pyproject

      - name: Build .deb (binary only, unsigned)
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb
        run: |
          mkdir -p dist
          cp ../tvdinner_*_all.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .rpm in a Fedora container
        # rpm/tvdinner.spec depends on Fedora's own python3-rpm-macros
        # (%pyproject_wheel, %{python3_sitelib}, etc.), which don't
        # exist on the Ubuntu runner itself -- so the actual rpmbuild
        # runs inside a Fedora container, with the checked-out repo
        # bind-mounted in. Pin this to a specific Fedora release
        # instead of ':latest' if build reproducibility matters more
        # than always tracking current Fedora.
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:latest bash -c '
            set -euo pipefail
            dnf install -y rpm-build rpmdevtools git python3-devel python3-setuptools python3-pip python3-wheel pyproject-rpm-macros
            git config --global --add safe.directory /work
            rpmdev-setuptree
            version=$(awk "/^Version:/ {print \$2; exit}" rpm/tvdinner.spec)
            git archive --format=tar.gz --prefix="tvdinner-${version}/" HEAD -o "$HOME/rpmbuild/SOURCES/tvdinner-${version}.tar.gz"
            cp rpm/tvdinner.spec "$HOME/rpmbuild/SPECS/tvdinner.spec"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/tvdinner.spec"
            mkdir -p dist
            cp "$HOME"/rpmbuild/RPMS/noarch/*.rpm dist/
          '

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tvdinner and its Windows dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Download and extract libmpv-2.dll
        # mpv-winbuild-cmake publishes dated releases (asset names change
        # every time), so resolve the current one via the GitHub API
        # rather than a hardcoded URL. The plain (non "-v3") x86_64 dev
        # build is used for the widest CPU compatibility; "dev" packages
        # bundle libmpv-2.dll alongside headers/import lib.
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+-git-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a matching mpv-dev-x86_64 asset" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          New-Item -ItemType Directory -Force -Path windows\build | Out-Null
          7z e mpv-dev.7z -owindows\build libmpv-2.dll -r -y

      - name: Build the frozen app with PyInstaller
        run: pyinstaller windows/tvdinner.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (python -c "from tvdinner import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\tvdinner.iss" "/DMyAppVersion=$version"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist_installer/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tvdinner and its macOS build dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Locate libmpv.dylib from Homebrew's mpv formula
        # macos-latest runners ship Homebrew preinstalled. Prefer the
        # real, versioned file (libmpv.N.dylib) over the unversioned
        # libmpv.dylib symlink some formula versions install, so the
        # bundle contains an actual file rather than a dangling symlink.
        run: |
          brew install mpv
          mkdir -p macos/build
          mpv_lib_dir="$(brew --prefix mpv)/lib"
          ls -la "$mpv_lib_dir"
          src_dylib=$(ls "$mpv_lib_dir"/libmpv.*.dylib 2>/dev/null | head -1)
          if [ -z "$src_dylib" ]; then
            src_dylib="$mpv_lib_dir/libmpv.dylib"
          fi
          cp -L "$src_dylib" macos/build/libmpv.dylib

      - name: Generate tvdinner.icns from the existing marketing-site icon
        run: |
          iconset=macos/build/tvdinner.iconset
          mkdir -p "$iconset"
          src=docs/assets/icon-512.png
          sips -z 16 16 "$src" --out "$iconset/icon_16x16.png"
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 "$src" --out "$iconset/icon_32x32.png"
          sips -z 64 64 "$src" --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 "$src" --out "$iconset/icon_128x128.png"
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 "$src" --out "$iconset/icon_256x256.png"
          sips -z 512 512 "$src" --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 "$src" --out "$iconset/icon_512x512.png"
          iconutil -c icns "$iconset" -o macos/build/tvdinner.icns

      - name: Build tvdinner.app with PyInstaller
        run: pyinstaller macos/tvdinner.spec

      - name: Package the .dmg
        run: |
          version=$(python3 -c "from tvdinner import __version__; print(__version__)")
          staging=dist_installer/dmg_staging
          mkdir -p "$staging"
          cp -R dist/tvdinner.app "$staging/"
          cp macos/THIRD_PARTY_NOTICES.txt "$staging/"
          cp README.md "$staging/README.txt"
          hdiutil create -volname tvdinner -srcfolder "$staging" -ov -format UDZO "dist_installer/tvdinner-${version}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist_installer/*.dmg

  release:
    needs: [build-deb, build-rpm, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "tvdinner ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*
