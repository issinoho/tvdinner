name: Build and publish release packages

# Fires on every version tag push (e.g. v1.0.0, v1.0.1, ...) -- matches the
# manual workflow used up through v0.1.0-18: tag, build .deb, .rpm, and a
# Windows installer, attach all three to the GitHub Release for that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release from this run (leave unchecked for a throwaway test build -- artifacts are still downloadable from the run page)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Debian packaging build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools pybuild-plugin-pyproject

      - name: Build .deb (binary only, unsigned)
        run: dpkg-buildpackage -us -uc -b

      - name: Collect .deb
        run: |
          mkdir -p dist
          cp ../tvdinner_*_all.deb dist/

      - uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build .rpm in a Fedora container
        # rpm/tvdinner.spec depends on Fedora's own python3-rpm-macros
        # (%pyproject_wheel, %{python3_sitelib}, etc.), which don't
        # exist on the Ubuntu runner itself -- so the actual rpmbuild
        # runs inside a Fedora container, with the checked-out repo
        # bind-mounted in. Pin this to a specific Fedora release
        # instead of ':latest' if build reproducibility matters more
        # than always tracking current Fedora.
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:latest bash -c '
            set -euo pipefail
            dnf install -y rpm-build rpmdevtools git python3-devel python3-setuptools python3-pip python3-wheel pyproject-rpm-macros
            git config --global --add safe.directory /work
            rpmdev-setuptree
            version=$(awk "/^Version:/ {print \$2; exit}" rpm/tvdinner.spec)
            git archive --format=tar.gz --prefix="tvdinner-${version}/" HEAD -o "$HOME/rpmbuild/SOURCES/tvdinner-${version}.tar.gz"
            cp rpm/tvdinner.spec "$HOME/rpmbuild/SPECS/tvdinner.spec"
            rpmbuild -ba "$HOME/rpmbuild/SPECS/tvdinner.spec"
            mkdir -p dist
            cp "$HOME"/rpmbuild/RPMS/noarch/*.rpm dist/
          '

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: dist/*.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tvdinner and its Windows dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Download and extract libmpv-2.dll
        # mpv-winbuild-cmake publishes dated releases (asset names change
        # every time), so resolve the current one via the GitHub API
        # rather than a hardcoded URL. The plain (non "-v3") x86_64 dev
        # build is used for the widest CPU compatibility; "dev" packages
        # bundle libmpv-2.dll alongside headers/import lib. Authenticated
        # with the workflow's own GITHUB_TOKEN (read-only against this
        # unrelated public repo, just to raise the rate limit) -- an
        # anonymous call here hit GitHub's 60-req/hour-per-IP limit and
        # failed the v0.1.0-86 release after three tag pushes in one day
        # exhausted it; authenticated requests get 5000/hour instead.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d+-git-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a matching mpv-dev-x86_64 asset" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          New-Item -ItemType Directory -Force -Path windows\build | Out-Null
          7z e mpv-dev.7z -owindows\build libmpv-2.dll -r -y

      - name: Build the frozen app with PyInstaller
        run: pyinstaller windows/tvdinner.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (python -c "from tvdinner import __version__; print(__version__)").Trim()
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\tvdinner.iss" "/DMyAppVersion=$version"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist_installer/*.exe

  release:
    needs: [build-deb, build-rpm, build-windows]
    # A tag push always publishes (existing behavior); a manual
    # workflow_dispatch run only does if explicitly asked to via
    # publish_release, so triggering this for a throwaway test build (e.g.
    # verifying an experimental branch on real hardware before it's ready
    # to ship) doesn't leave a public Release/tag behind for a branch that
    # may not even be a good fix, let alone something to ship.
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract this version's CHANGELOG.md section for the release body
        # generate_release_notes below only ever produces a bare "Full
        # Changelog: <compare link>" here, since this repo pushes straight
        # to master rather than merging PRs (what GitHub's own note
        # generator actually summarizes) -- CHANGELOG.md already has a
        # real, hand-written entry per version, so pull the one matching
        # this tag out and use it as the release body instead, with the
        # compare link still appended after it (see generate_release_notes
        # below). Tolerant of a non-version ref (e.g. a workflow_dispatch
        # run off a branch, not a tag) -- an unmatched version just leaves
        # this file empty rather than failing the build.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF{p=1} p' | tac | awk 'NF{p=1} p' | tac > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.exe" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "tvdinner ${{ github.ref_name }}"
          # GitHub's own release API pre-pends body_path's content before
          # its generated notes (not the other way around), so this reads
          # as: this version's real changelog entry, then the standard
          # "Full Changelog: <compare link>" footer below it.
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/*
