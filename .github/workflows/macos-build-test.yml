name: (temporary) macOS build verification

# Manual-only, throwaway workflow to verify the dylibbundler fix to
# build-macos in release.yml without running the real release.yml
# (whose `release` job unconditionally creates/updates a GitHub Release
# even on a workflow_dispatch/branch trigger, using github.ref_name as
# the release name -- not safe to run from a branch). Delete this file
# once the fix is verified.

on:
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tvdinner and its macOS build dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Locate libmpv.dylib from Homebrew's mpv formula
        run: |
          brew install mpv
          mkdir -p macos/build
          mpv_lib_dir="$(brew --prefix mpv)/lib"
          ls -la "$mpv_lib_dir"
          src_dylib=$(ls "$mpv_lib_dir"/libmpv.*.dylib 2>/dev/null | head -1)
          if [ -z "$src_dylib" ]; then
            src_dylib="$mpv_lib_dir/libmpv.dylib"
          fi
          cp -L "$src_dylib" macos/build/libmpv.dylib

      - name: Generate tvdinner.icns from the existing marketing-site icon
        run: |
          iconset=macos/build/tvdinner.iconset
          mkdir -p "$iconset"
          src=docs/assets/icon-512.png
          sips -z 16 16 "$src" --out "$iconset/icon_16x16.png"
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 "$src" --out "$iconset/icon_32x32.png"
          sips -z 64 64 "$src" --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 "$src" --out "$iconset/icon_128x128.png"
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 "$src" --out "$iconset/icon_256x256.png"
          sips -z 512 512 "$src" --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 "$src" --out "$iconset/icon_512x512.png"
          iconutil -c icns "$iconset" -o macos/build/tvdinner.icns

      - name: Build tvdinner.app with PyInstaller
        run: pyinstaller macos/tvdinner.spec

      - name: Bundle libmpv's own Homebrew dependencies into the app
        run: |
          brew install dylibbundler
          dylibbundler -od -b \
            -x dist/tvdinner.app/Contents/MacOS/libmpv.dylib \
            -d dist/tvdinner.app/Contents/MacOS/ \
            -p @executable_path/

      - name: Report bundle contents for inspection
        run: |
          echo "=== bundle size ==="
          du -sh dist/tvdinner.app
          echo "=== Contents/MacOS listing ==="
          ls -la dist/tvdinner.app/Contents/MacOS/
          echo "=== libmpv.dylib dependencies after bundling ==="
          otool -L dist/tvdinner.app/Contents/MacOS/libmpv.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-test
          path: dist/tvdinner.app
