name: (temporary) macOS build verification

# Manual-only, throwaway workflow to verify the macos-15 runner pin
# fixes a real crash report (a build made on macos-latest/macos-26
# failed to load its own bundled libmpv.dylib on a real Sequoia Mac --
# "Symbol not found: _swift_coroFrameAlloc ... built for macOS 26.0
# which is newer than running OS"). Not run via the real release.yml
# since its `release` job unconditionally creates/updates a GitHub
# Release even on a workflow_dispatch/branch trigger. Delete this file
# once the fix is verified.

on:
  workflow_dispatch: {}

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch_label: arm64
          - runner: macos-15-intel
            arch_label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tvdinner and its macOS build dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Locate libmpv.dylib from Homebrew's mpv formula
        run: |
          brew install mpv
          mkdir -p macos/build
          mpv_lib_dir="$(brew --prefix mpv)/lib"
          ls -la "$mpv_lib_dir"
          src_dylib=$(ls "$mpv_lib_dir"/libmpv.*.dylib 2>/dev/null | head -1)
          if [ -z "$src_dylib" ]; then
            src_dylib="$mpv_lib_dir/libmpv.dylib"
          fi
          cp -L "$src_dylib" macos/build/libmpv.dylib

      - name: Generate tvdinner.icns from the existing marketing-site icon
        run: |
          iconset=macos/build/tvdinner.iconset
          mkdir -p "$iconset"
          src=docs/assets/icon-512.png
          sips -z 16 16 "$src" --out "$iconset/icon_16x16.png"
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 "$src" --out "$iconset/icon_32x32.png"
          sips -z 64 64 "$src" --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 "$src" --out "$iconset/icon_128x128.png"
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 "$src" --out "$iconset/icon_256x256.png"
          sips -z 512 512 "$src" --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 "$src" --out "$iconset/icon_512x512.png"
          iconutil -c icns "$iconset" -o macos/build/tvdinner.icns

      - name: Build tvdinner.app with PyInstaller
        run: pyinstaller macos/tvdinner.spec

      - name: Bundle libmpv's own Homebrew dependencies into the app
        run: |
          brew install dylibbundler
          dylibbundler -od -b \
            -x dist/tvdinner.app/Contents/Frameworks/libmpv.dylib \
            -d dist/tvdinner.app/Contents/Frameworks/mpv-libs/ \
            -p @executable_path/../Frameworks/mpv-libs/

      - name: Report the actual minimum OS this build declares/needs
        run: |
          echo "=== arch: ${{ matrix.arch_label }} / runner: ${{ matrix.runner }} ==="
          echo "--- macOS version this runner actually is ---"
          sw_vers
          echo "--- libmpv.dylib LC_BUILD_VERSION (should show a Sequoia-era SDK, not Tahoe) ---"
          otool -l dist/tvdinner.app/Contents/Frameworks/libmpv.dylib | grep -A4 LC_BUILD_VERSION
          echo "--- confirm no unresolvable symbols by actually loading it (dyld dry run) ---"
          otool -L dist/tvdinner.app/Contents/Frameworks/libmpv.dylib | head -5
          echo "--- try actually running the app briefly (should get to mpv init, not crash on import) ---"
          timeout 5 dist/tvdinner.app/Contents/MacOS/tvdinner < /dev/null > run.log 2>&1 || true
          cat run.log

      - name: Package the .dmg
        run: |
          version=$(python3 -c "from tvdinner import __version__; print(__version__)")
          staging=dist_installer/dmg_staging
          mkdir -p "$staging"
          cp -R dist/tvdinner.app "$staging/"
          cp macos/THIRD_PARTY_NOTICES.txt "$staging/"
          cp README.md "$staging/README.txt"
          hdiutil create -volname tvdinner -srcfolder "$staging" -ov -format UDZO "dist_installer/tvdinner-${version}-${{ matrix.arch_label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-test-${{ matrix.arch_label }}
          path: dist_installer/*.dmg
